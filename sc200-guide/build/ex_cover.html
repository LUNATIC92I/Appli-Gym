<!doctype html><html lang="fr"><head><meta charset="utf-8"><title>Examens blancs SC-200 — corrigés</title>
<style>:root {
  --navy: #0b2545; --blue: #0078d4; --blue2: #2b88d8; --grey: #5b6b7f; --light: #f3f6fa;
  --line: #d5dde8; --green: #107c10; --greenbg: #eef7ee; --amber: #8a5a00; --amberbg: #fff7e6;
  --code: #f6f8fb; --red: #a4262c;
}
@page { size: A4; }
* { box-sizing: border-box; }
html { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
body { font-family: "Inter", "Liberation Sans", "DejaVu Sans", Arial, sans-serif; font-feature-settings: "calt" 0, "case" 0; font-size: 9.6pt; line-height: 1.42; color: #1b1f24; background: #fff; margin: 0; }
a { color: var(--blue); text-decoration: none; word-break: break-all; }
code { font-family: "DejaVu Sans Mono", "Liberation Mono", monospace; font-size: 8.4pt; background: var(--code); padding: 0 2px; border-radius: 2px; color: #0b3a6b; }
h1.part { page-break-before: always; font-size: 20pt; color: var(--navy); border-bottom: 3px solid var(--blue); padding-bottom: 6px; margin: 0 0 12px; }
h2 { font-size: 14pt; color: var(--navy); margin: 18px 0 8px; border-left: 5px solid var(--blue); padding-left: 8px; page-break-after: avoid; }
h3 { font-size: 11.5pt; color: var(--blue); margin: 14px 0 6px; page-break-after: avoid; }
h4, h5 { page-break-after: avoid; }
table { border-collapse: collapse; width: 100%; margin: 8px 0; font-size: 8.6pt; }
th { background: var(--navy); color: #fff; text-align: left; padding: 4px 6px; font-weight: 600; }
td { border: 1px solid var(--line); padding: 3px 6px; vertical-align: top; }
tr:nth-child(even) td { background: var(--light); }
tr { page-break-inside: avoid; }
.mk { font-size: 2px; color: #fff; letter-spacing: 0; }
.small { font-size: 8pt; color: var(--grey); }
blockquote { border-left: 4px solid var(--blue2); background: var(--light); margin: 8px 0; padding: 6px 10px; }
/* couverture */
.cover { height: 297mm; padding: 34mm 22mm 18mm; background: linear-gradient(160deg, #0b2545 0%, #13315c 55%, #0078d4 100%); color: #fff; position: relative; }
.cover .band { font-size: 9pt; letter-spacing: 2px; color: #9cc7f0; border-bottom: 1px solid #3d6aa0; padding-bottom: 8px; }
.cover h1 { font-size: 30pt; line-height: 1.15; margin: 26mm 0 8mm; font-weight: 700; }
.cover .sub { font-size: 15pt; color: #cfe4f9; }
.cover .facts { display: flex; gap: 10mm; margin-top: 22mm; }
.cover .facts div { border-top: 3px solid #50a7f0; padding-top: 6px; width: 45mm; }
.cover .facts b { display: block; font-size: 22pt; }
.cover .facts span { font-size: 9pt; color: #cfe4f9; }
.cover .ref { margin-top: 22mm; font-size: 9.5pt; color: #dbe9f7; line-height: 1.6; }
.cover .date { position: absolute; bottom: 30mm; left: 22mm; font-size: 10pt; color: #fff; }
.cover .disc { position: absolute; bottom: 14mm; left: 22mm; right: 22mm; font-size: 7.5pt; color: #9cb8d6; }
.small-cover h1 { font-size: 26pt; }
/* table des matières */
.toc1, .toc2 { display: flex; align-items: baseline; }
.toc1 { font-weight: 600; margin-top: 7px; color: var(--navy); font-size: 10pt; }
.toc2 { margin-left: 16px; font-size: 9pt; }
.toc1 a, .toc2 a { color: inherit; word-break: normal; }
.dots { flex: 1; border-bottom: 1px dotted #9aa8b8; margin: 0 4px; transform: translateY(-3px); }
.pg { min-width: 22px; text-align: right; }
/* questions */
.q { border: 1px solid var(--line); border-radius: 4px; padding: 8px 10px 6px; margin: 10px 0 14px; }
.q .qt { margin: 0 0 4px; font-size: 11pt; color: var(--navy); }
.meta { display: flex; flex-wrap: wrap; gap: 3px 14px; font-size: 7.8pt; color: var(--grey); border-bottom: 1px solid var(--line); padding-bottom: 4px; margin-bottom: 6px; }
.meta b { color: var(--navy); font-weight: 600; }
.stem .lbl { font-weight: 700; color: var(--navy); }
.stem p:first-of-type { display: inline; }
.stem p { margin: 4px 0; }
.multi { font-weight: 700; color: var(--blue); }
ol.opts { list-style: none; padding: 0; margin: 6px 0; }
ol.opts li { display: flex; gap: 6px; margin: 3px 0; padding: 3px 6px; background: var(--light); border-radius: 3px; page-break-inside: avoid; }
ol.opts li .L { font-weight: 700; color: var(--blue); min-width: 14px; }
ol.opts li p { margin: 0; }
.corr { border-left: 4px solid var(--green); background: #fbfdfb; padding: 4px 10px 4px; margin-top: 8px; }
.corr .ans { background: var(--greenbg); color: var(--green); font-weight: 700; padding: 3px 8px; margin: 2px -10px 4px; font-size: 10pt; }
.corr h5 { margin: 7px 0 2px; color: var(--navy); font-size: 9.2pt; }
.corr p { margin: 3px 0; }
.corr ul, .corr ol { margin: 3px 0; padding-left: 18px; }
.wrong li { margin: 2px 0; }
.key { background: var(--amberbg); border: 1px solid #f0d9a8; border-radius: 3px; padding: 4px 8px; margin: 8px 0 4px; color: #4a3500; }
.key p { display: inline; margin: 0; }
.key b { color: var(--amber); }
ul.refs { font-size: 8pt; padding-left: 16px; margin: 2px 0; }
.code { margin: 5px 0; border: 1px solid var(--line); border-radius: 3px; page-break-inside: avoid; }
.codelabel { font-size: 7pt; text-transform: uppercase; letter-spacing: .5px; background: #e8eef6; color: var(--navy); padding: 2px 6px; }
.code.kqlbad .codelabel { background: #fbe9ea; color: var(--red); }
.code.kqlx .codelabel { background: #e6f1fb; }
.code pre { margin: 0; padding: 5px 8px; font-family: "DejaVu Sans Mono", "Liberation Mono", monospace; font-size: 7.9pt; line-height: 1.35; white-space: pre-wrap; word-break: break-word; background: var(--code); }
.code .k { color: #0b5cad; font-weight: 600; } .code .s { color: #a31515; } .code .c { color: #4f7a28; font-style: italic; }
.code .n { color: #098658; } .code .o { color: #6b2fa0; font-weight: 700; }
/* examens */
.q.exam { border-color: #c9d6e6; }
table.key td.a { font-weight: 700; color: var(--green); white-space: nowrap; text-align: center; }
table.key .comp { margin-top: 3px; font-size: 8.2pt; color: #333; }
.note { background: var(--light); border: 1px solid var(--line); padding: 6px 10px; font-size: 8.6pt; }
/* annexes */
table.matrix td:not(:first-child), table.matrix th:not(:first-child) { text-align: center; }
table.matrix tr.tot td { font-weight: 700; background: #e8eef6; }
.index { column-count: 2; column-gap: 18px; font-size: 8.4pt; }
.ix { break-inside: avoid; margin: 1px 0; }
ul.biblio { font-size: 8.4pt; padding-left: 16px; }
ul.biblio li { margin: 2px 0; }
.fiche { border: 1px solid var(--line); border-top: 4px solid var(--blue); padding: 4px 10px; margin: 10px 0; }
</style></head><body><div class="cover small-cover"><div class="band">EXAMEN SC-200 · ENTRAÎNEMENT EN CONDITIONS RÉELLES</div>
<h1>CORRIGÉS DES EXAMENS BLANCS</h1>
<div class="sub">Guide complet de préparation à la certification Microsoft SC-200</div>
<div class="date">3 examens de 50 questions · vérification documentaire : 2026-10-12</div></div></body></html>
